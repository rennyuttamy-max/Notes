<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KopiKas ☕</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f1e8;
    color: #382b24;
}

.app {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 25px 18px 40px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo h1 {
    font-size: 28px;
}

.logo p {
    color: #261911;
    margin-top: 5px;
}

.coffee {
    font-size: 35px;
}

.search {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.search input {
    flex: 1;
    border: none;
    outline: none;
    padding: 13px;
    border-radius: 13px;
    background: white;
}

button {
    border: none;
    cursor: pointer;
}

.add {
    background: #261911;
    color: white;
    padding: 13px 15px;
    border-radius: 13px;
    font-weight: bold;
}

.total {
    background: #e9d9c9;
    padding: 17px;
    border-radius: 18px;
    margin-bottom: 18px;
}

.total small {
    color: #261911;
}

.total h2 {
    margin-top: 5px;
}

.note {
    background: white;
    padding: 17px;
    border-radius: 18px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.note h3 {
    margin-bottom: 5px;
}

.date {
    color: #999;
    font-size: 12px;
}

.content {
    margin-top: 10px;
    color: #261911;
    white-space: pre-wrap;
    line-height: 1.5;
}

.note-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 13px;
}

.category {
    background: #f1e5d8;
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 12px;
}

.amount {
    font-weight: bold;
    color: #6b4f3f;
}

.actions {
    margin-top: 12px;
    display: flex;
    gap: 6px;
}

.actions button {
    padding: 7px 12px;
    border-radius: 9px;
}

.edit {
    background: #eee3d8;
}

.delete {
    background: #f1dcd7;
    color: #81483f;
}

.coffee-check {
    margin-top: 20px;
    padding: 18px;
    background: #e8d6c4;
    border-radius: 18px;
    line-height: 1.5;
}

.empty {
    text-align: center;
    color: #96877d;
    padding: 50px 10px;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 450px;
    background: #fffaf5;
    padding: 24px;
    border-radius: 22px;
}

.modal-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.close {
    background: none;
    font-size: 25px;
}

.form {
    margin-bottom: 15px;
}

.form label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

.form input,
.form textarea,
.form select {
    width: 100%;
    border: none;
    outline: none;
    background: white;
    padding: 12px;
    border-radius: 11px;
}

.form textarea {
    height: 110px;
    resize: vertical;
}

.save {
    width: 100%;
    padding: 13px;
    background: #6b4f3f;
    color: white;
    border-radius: 12px;
    font-weight: bold;
}

@media(max-width:500px) {
    .search {
        flex-direction: column;
    }

    .add {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        <h1>KopiKas ☕</h1>
        <p>My Money Notes</p>
    </div>

    <div class="coffee">☕</div>
</header>

<div class="search">
    <input
        id="search"
        type="text"
        placeholder="Cari catatan..."
        oninput="render()"
    >

    <button class="add" onclick="openForm()">
        ＋ Buat Catatan
    </button>
</div>

<div class="total">
    <small>Total pengeluaran</small>
    <h2 id="total">Rp0</h2>
</div>

<div id="notes"></div>

<div class="coffee-check">
    <b>☕ Coffee Check</b>
    <p id="coffeeText">
        Belum ada catatan kopi.
    </p>
</div>

</div>


<!-- FORM CATATAN -->

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-head">
    <h2 id="formTitle">Buat Catatan ✍️</h2>

    <button class="close" onclick="closeForm()">×</button>
</div>

<form onsubmit="saveNote(event)">

<div class="form">
    <label>Judul</label>

    <input
        id="title"
        type="text"
        placeholder="Contoh: Ngopi sore"
        required
    >
</div>

<div class="form">
    <label>Catatan</label>

    <textarea
        id="content"
        placeholder="Tulis catatan kamu..."
    ></textarea>
</div>

<div class="form">
    <label>Nominal</label>

    <input
        id="amount"
        type="number"
        placeholder="15000"
        min="0"
    >
</div>

<div class="form">
    <label>Kategori</label>

    <select id="category">

        <option>☕ Kopi</option>
        <option>🍜 Makan</option>
        <option>🚌 Transportasi</option>
        <option>📚 Kuliah</option>
        <option>🛍️ Belanja</option>
        <option>🎮 Hiburan</option>
        <option>💸 Lainnya</option>

    </select>
</div>

<button class="save" type="submit">
    💾 Simpan Catatan
</button>

</form>

</div>
</div>


<script>

/* =====================================
   DATA CATATAN
===================================== */

let notes = JSON.parse(
    localStorage.getItem("KopiKasNotes")
) || [];

let editingId = null;


/* =====================================
   FORMAT RUPIAH
===================================== */

function rupiah(number) {

    return "Rp" +
        Number(number).toLocaleString("id-ID");

}


/* =====================================
   SIMPAN KE BROWSER
===================================== */

function saveToBrowser() {

    localStorage.setItem(
        "KopiKasNotes",
        JSON.stringify(notes)
    );

}


/* =====================================
   TANGGAL
===================================== */

function today() {

    return new Date().toLocaleDateString(
        "id-ID",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================
   TAMPILKAN CATATAN
===================================== */

function render() {

    const container =
        document.getElementById("notes");

    const keyword =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered = notes.filter(note =>

        note.title.toLowerCase().includes(keyword) ||

        note.content.toLowerCase().includes(keyword) ||

        note.category.toLowerCase().includes(keyword)

    );


    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:40px;">📝</div>
                <p>Belum ada catatan.</p>
                <small>
                    Tulis pengeluaran pertama kamu.
                </small>
            </div>
        `;

    }


    filtered.forEach(note => {

        const div =
            document.createElement("div");

        div.className = "note";


        div.innerHTML = `

            <h3>${escapeHTML(note.title)}</h3>

            <div class="date">
                ${note.date}
            </div>

            ${
                note.content
                ?
                `<div class="content">
                    ${escapeHTML(note.content)}
                </div>`
                :
                ""
            }

            <div class="note-bottom">

                <span class="category">
                    ${note.category}
                </span>

                <span class="amount">
                    ${rupiah(note.amount)}
                </span>

            </div>

            <div class="actions">

                <button
                    class="edit"
                    onclick="editNote(${note.id})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteNote(${note.id})"
                >
                    🗑️ Hapus
                </button>

            </div>
        `;


        container.appendChild(div);

    });


    updateTotal();

    updateCoffee();

}


/* =====================================
   TOTAL
===================================== */

function updateTotal() {

    const total =
        notes.reduce(
            (sum, note) =>
                sum + Number(note.amount),
            0
        );


    document.getElementById(
        "total"
    ).textContent = rupiah(total);

}


/* =====================================
   COFFEE CHECK
===================================== */

function updateCoffee() {

    const coffee =
        notes.filter(
            note =>
                note.category === "☕ Kopi"
        );


    const total =
        coffee.reduce(
            (sum, note) =>
                sum + Number(note.amount),
            0
        );


    document.getElementById(
        "coffeeText"
    ).innerHTML = coffee.length === 0

        ? "Belum ada catatan kopi. ☕"

        : `
            Bulan ini kamu sudah ngopi
            <b>${coffee.length} kali</b> ☕<br>

            Total:
            <b>${rupiah(total)}</b>

            <br><br>

            "kopi memang kecil-kecil,
            tapi kalau dikumpulin... 👀"
        `;

}


/* =====================================
   BUKA FORM
===================================== */

function openForm() {

    editingId = null;

    document.getElementById(
        "formTitle"
    ).textContent =
        "Buat Catatan ✍️";


    document.querySelector("form").reset();


    document.getElementById(
        "modal"
    ).classList.add("show");

}


/* =====================================
   TUTUP FORM
===================================== */

function closeForm() {

    document.getElementById(
        "modal"
    ).classList.remove("show");

}


/* =====================================
   SIMPAN CATATAN
===================================== */

function saveNote(event) {

    event.preventDefault();


    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const content =
        document.getElementById(
            "content"
        ).value.trim();


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        ) || 0;


    const category =
        document.getElementById(
            "category"
        ).value;


    /* EDIT CATATAN */

    if (editingId !== null) {

        const note =
            notes.find(
                n => n.id === editingId
            );


        note.title = title;

        note.content = content;

        note.amount = amount;

        note.category = category;

    }


    /* CATATAN BARU */

    else {

        notes.unshift({

            id: Date.now(),

            title: title,

            content: content,

            amount: amount,

            category: category,

            date: today()

        });

    }


    /*
       INI BAGIAN PENTING:
       DATA BENAR-BENAR DISIMPAN
       KE LOCAL STORAGE BROWSER
    */

    saveToBrowser();


    render();

    closeForm();

}


/* =====================================
   EDIT
===================================== */

function editNote(id) {

    const note =
        notes.find(
            n => n.id === id
        );


    if (!note) return;


    editingId = id;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Catatan ✏️";


    document.getElementById(
        "title"
    ).value =
        note.title;


    document.getElementById(
        "content"
    ).value =
        note.content;


    document.getElementById(
        "amount"
    ).value =
        note.amount;


    document.getElementById(
        "category"
    ).value =
        note.category;


    document.getElementById(
        "modal"
    ).classList.add("show");

}


/* =====================================
   HAPUS
===================================== */

function deleteNote(id) {

    if (
        !confirm(
            "Hapus catatan ini?"
        )
    ) return;


    notes =
        notes.filter(
            note =>
                note.id !== id
        );


    saveToBrowser();

    render();

}


/* =====================================
   AMANKAN TEKS
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================
   JALANKAN
===================================== */

render();

</script>

</body>
</html>
